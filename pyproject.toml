[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-prefix-rl"
version = "0.1.0"
description = "Exact-KL prefix clipping for autoregressive policy optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["epic*"]
exclude = ["vendor*", "tests*", "scripts*"]
